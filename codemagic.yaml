workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: 3.47.2  # <--- This is the key
      vars:
        GOOGLE_SERVICES_JSON: $GOOGLE_SERVICES_JSON
    scripts:
      - name: Setup Google Services
        script: |
          echo "$GOOGLE_SERVICES_JSON" | tr -d '\n' | base64 --decode > android/app/google-services.json
          ls -l android/app/google-services.json
      - name: Flutter pub get
        script: |
          flutter --version
          flutter pub get
      - name: Clean
        script: |
          flutter clean
          flutter pub get
      - name: Flutter build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
